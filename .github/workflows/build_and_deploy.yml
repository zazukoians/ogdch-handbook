name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - docusaurus

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npm run build -- --config docusaurus.preview.config.ts
        env:
          IGNORE_BROKEN_LINKS: true
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4.2.0
        with:
          build_dir: ./build
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
